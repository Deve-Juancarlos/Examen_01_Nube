<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Persona</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50:  '#eff6ff',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-100 via-slate-50 to-blue-50 antialiased">

    <header class="bg-white/80 backdrop-blur shadow-sm sticky top-0 z-10">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex items-center justify-between">
            <h1 class="text-lg sm:text-xl font-bold text-slate-800">Registro de Personal</h1>
            <a href="/administrar"
               class="inline-flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-medium
                      text-brand-700 bg-brand-50 hover:bg-brand-500 hover:text-white
                      transition-colors duration-200">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none"
                     viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round"
                          d="M4 6h16M4 12h16M4 18h16"/>
                </svg>
                <span class="hidden xs:inline sm:inline">Administrar</span>
            </a>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-10">
        <section class="bg-white rounded-2xl shadow-lg ring-1 ring-slate-200/60
                        p-5 sm:p-8 max-w-2xl mx-auto">
            <div class="mb-6 text-center">
                <div class="inline-flex items-center justify-center h-12 w-12 rounded-full bg-brand-50 text-brand-600 mb-3">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none"
                         viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                              d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                    </svg>
                </div>
                <h2 class="text-xl sm:text-2xl font-bold text-slate-800">Nuevo Registro</h2>
                <p class="text-sm text-slate-500 mt-1">Complete los datos del personal.</p>
            </div>

            <form action="/registrar" method="POST" class="grid grid-cols-1 sm:grid-cols-2 gap-4 sm:gap-5">

                <div class="sm:col-span-1">
                    <label for="dni" class="block text-sm font-semibold text-slate-700 mb-1.5">DNI</label>
                    <input type="text" id="dni" name="dni" required
                           inputmode="numeric" pattern="[0-9A-Za-z\- ]+"
                           placeholder="Ej. 12345678"
                           class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300
                                  focus:border-brand-500 focus:ring-2 focus:ring-brand-500/30
                                  outline-none transition placeholder:text-slate-400">
                </div>

                <div class="sm:col-span-1">
                    <label for="telefono" class="block text-sm font-semibold text-slate-700 mb-1.5">Teléfono</label>
                    <input type="text" id="telefono" name="telefono"
                           inputmode="tel" placeholder="Ej. 999111222"
                           class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300
                                  focus:border-brand-500 focus:ring-2 focus:ring-brand-500/30
                                  outline-none transition placeholder:text-slate-400">
                </div>

                <div class="sm:col-span-1">
                    <label for="nombre" class="block text-sm font-semibold text-slate-700 mb-1.5">Nombre</label>
                    <input type="text" id="nombre" name="nombre" required
                           placeholder="Ej. Juan"
                           class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300
                                  focus:border-brand-500 focus:ring-2 focus:ring-brand-500/30
                                  outline-none transition placeholder:text-slate-400">
                </div>

                <div class="sm:col-span-1">
                    <label for="apellido" class="block text-sm font-semibold text-slate-700 mb-1.5">Apellido</label>
                    <input type="text" id="apellido" name="apellido" required
                           placeholder="Ej. Ochoa"
                           class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300
                                  focus:border-brand-500 focus:ring-2 focus:ring-brand-500/30
                                  outline-none transition placeholder:text-slate-400">
                </div>

                <div class="sm:col-span-2">
                    <label for="direccion" class="block text-sm font-semibold text-slate-700 mb-1.5">Dirección</label>
                    <input type="text" id="direccion" name="direccion"
                           placeholder="Ej. Calle Las Flores 123"
                           class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300
                                  focus:border-brand-500 focus:ring-2 focus:ring-brand-500/30
                                  outline-none transition placeholder:text-slate-400">
                </div>

                <div class="sm:col-span-2 flex flex-col-reverse sm:flex-row sm:justify-end gap-3 pt-2">
                    <button type="reset"
                            class="w-full sm:w-auto px-5 py-2.5 rounded-lg border border-slate-300
                                   text-slate-700 font-medium hover:bg-slate-100 transition">
                        Limpiar
                    </button>
                    <button type="submit"
                            class="w-full sm:w-auto inline-flex items-center justify-center gap-2
                                   px-6 py-2.5 rounded-lg bg-brand-600 text-white font-semibold
                                   hover:bg-brand-700 active:bg-brand-700
                                   focus:ring-4 focus:ring-brand-500/30
                                   shadow-sm hover:shadow transition">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none"
                             viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
                        </svg>
                        Registrar
                    </button>
                </div>
            </form>
        </section>
    </main>

    {% if request.args.get('exito') %}
    <div id="modal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 backdrop-blur-sm">
        <div class="bg-white rounded-2xl shadow-2xl max-w-sm w-full mx-4 p-6 text-center transform transition-all">
            <div class="mx-auto h-14 w-14 rounded-full bg-green-100 flex items-center justify-center mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-green-600" fill="none"
                     viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
                </svg>
            </div>
            <h3 class="text-lg font-bold text-slate-800 mb-1">¡Registro exitoso!</h3>
            <p class="text-sm text-slate-500 mb-5">El personal fue guardado correctamente.</p>
            <button onclick="cerrarMensaje()"
                    class="w-full px-4 py-2.5 rounded-lg bg-brand-600 text-white font-medium
                           hover:bg-brand-700 transition">
                Aceptar
            </button>
        </div>
    </div>
    {% endif %}

    <script>
        function cerrarMensaje() {
            var modal = document.getElementById('modal');
            if (modal) {
                modal.style.display = 'none';
                const url = new URL(window.location.href);
                url.searchParams.delete('exito');
                window.history.replaceState({}, '', url);
            }
        }
    </script>
</body>
</html>
